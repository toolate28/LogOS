source_bindings:
  youtube:
    trust_class: observational-media
    authority_effect: none
    required_fields:
      - videoId
      - segments
      - transcriptSha256
  notebooklm:
    trust_class: secondary-synthesis
    authority_effect: none
    required_fields:
      - documentId
      - snapshotPath
      - snapshotSha256
  grokCollections:
    trust_class: clustered-commentary
    authority_effect: none
    required_fields:
      - collectionId
      - snapshotPath
      - snapshotSha256
  googleDrive:
    trust_class: bulk-archive
    authority_effect: none
    required_fields:
      - objectId
      - sha256
      - pathHint
  githubDiscussion:
    trust_class: narrow-waist-coordination
    authority_effect: none
    required_fields:
      - number
      - url

invariant_profiles:
  norton-sakuma-3a:
    authority_effect: none
    allowed_involutions:
      - swap-observer-observed
      - reverse-segment-order
      - mirror-claim-polarity
    return_conditions:
      - double-normalization-fixed-point
      - duplicate-fragment-ratio-below-budget
      - source-order-independent-digests
    noise_erasures:
      - timestamp-jitter
      - ocr-noise
      - ui-chrome
      - duplicate-semantic-fragments
    failure_states:
      - involution_escape
      - noise-budget-exceeded
      - source-class-violation
      - component-path-drift
      - codeql-incompatible

closure_states:
  - observed
  - normalized
  - reconciled
  - drifted
  - closure-ready
  - held

narrow_wormhole:
  authority_effect: none
  discussion_required: true
  ephemeral_root_required: true
  state_root: runner.temp

