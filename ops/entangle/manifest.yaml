# Hard excludes for every emit (never ship these)
excludes:
  - "**/target/**"
  - "**/crates/target/**"
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.lake/**"
  - "**/__pycache__/**"
  - "**/*.pdb"
  - "**/*.rlib"
  - "**/*.rmeta"

# Remote PR layout remains optional; observation closure uses the narrow wormhole.
remote:
  base: main
  branch_prefix: entangle/
  label: entangle
  pr_title_template: "entangle({id}): {title}"
  body_template: |
    ## Entangle slot `{id}`

    **ATOM:** `ATOM-ENTANGLE-MANIFEST-20260809`
    **Priority:** {priority}
    **SAIF lane:** {saif}

    ### Paths
    {paths}

    ### Verify
    {verify}

    ### Narrow wormhole
    1. Operator binds a GitHub Discussion to the envelope.
    2. ENTANGLE Observe normalizes into an ephemeral root.
    3. Reconcile compares observations to component paths and invariant profile.
    4. Human approves merge after closure-ready or bounded drift review.

    capability ≠ authority · Music conserved
