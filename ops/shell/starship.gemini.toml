# =============================================================================
# Tri-Weavon · GEMINI / Scale · starship
# Color lock: green #4ade80  · fib≈3  · embed / filter / research width
# Distinct from Grok (gold pulse) and Claude (cyan structure).
# =============================================================================
# ACTIVATE:
#   $env:STARSHIP_CONFIG = "$env:LOGOS_ROOT\ops\shell\starship.gemini.toml"
#   $env:CTWFI_STRAND = "gemini"
#   # or: Set-TriWeavonStrand gemini
# =============================================================================

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 2000
add_newline = true

# Wide research format — long path, packages, cloud-ish status slots
format = """
[▽ GEMINI](bold #4ade80)\
[ · scale](dimmed #4ade80)\
$env_var\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$cmd_duration\
$line_break\
$character\
"""

right_format = """$time$status"""

[character]
success_symbol = "[∇ ❯](bold #4ade80)"
error_symbol = "[∇ ❯](bold red)"
vicmd_symbol = "[∇](bold #86efac)"

[directory]
truncation_length = 6
truncate_to_repo = false
style = "bold #4ade80"
repo_root_style = "bold underline #86efac"
# Scale wants more path context than Grok's dense pulse
fish_style_pwd_dir_length = 2

[username]
show_always = false
style_user = "#4ade80"

[hostname]
ssh_only = true
style = "bold #86efac"

[git_branch]
symbol = " "
style = "bold #86efac"

[git_status]
style = "bold #4ade80"
ahead = "↑"
behind = "↓"
modified = "±"

[cmd_duration]
min_time = 1_000
format = "· $duration · "

[nodejs]
symbol = "node "
style = "#4ade80"

[python]
symbol = "py "
style = "#86efac"

[rust]
symbol = "rs "
style = "#4ade80"

[time]
disabled = false
format = "[$time](dimmed #4ade80)"
time_format = "%Y-%m-%d %H:%M"

[status]
disabled = false
style = "bold #4ade80"
format = "[$status]($style) "

[env_var.CTWFI_STRAND]
variable = "CTWFI_STRAND"
default = "gemini"
style = "bold #4ade80"
format = "[$env_value]($style) "

[env_var.CTWFI_INVARIANT]
variable = "CTWFI_INVARIANT"
default = "α+ω=15"
style = "dimmed #4ade80"
format = "[$env_value]($style) "
