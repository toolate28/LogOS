# Dependabot — supply-chain updates (advisory; capability ≠ authority)
# ATOM: ATOM-DEPENDABOT-20260730-sm100
# Affirmed: ATOM-DEPENDABOT-LABEL-AFFIRM-20260731 — labels verified present
version: 2
updates:
  # Root Cargo workspace (LogOS monorepo)
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - rust
      - advisory
    commit-message:
      prefix: "deps(cargo)"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - advisory
    commit-message:
      prefix: "deps(actions)"

  # Optional pre-commit / Python tooling (if present at root)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - python
      - advisory
    commit-message:
      prefix: "deps(pip)"
    # No-op when no requirements file exists; Dependabot skips gracefully.
