# CI policy gate — fail-closed before heavy jobs matter on remote
# ATOM: ATOM-CI-POLICY-PINS-20260804
# Enforces full-length commit SHA pins (repo sha_pinning_required=true).
# capability ≠ authority.

name: CI Policy

on:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
      - "ops/ci/assert_action_pins.py"
      - "ops/ci/codex_scan.py"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/**"
      - "ops/ci/assert_action_pins.py"
      - "ops/ci/codex_scan.py"
      - ".github/dependabot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-pins:
    name: Action SHA pins (fail-closed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Assert every uses: is a full commit SHA
        run: |
          set -euo pipefail
          python ops/ci/assert_action_pins.py

      - name: Job summary
        if: always()
        run: |
          {
            echo "## CI Policy"
            echo ""
            echo "- Gate: full 40-char commit SHA on every \`uses:\`"
            echo "- Script: \`ops/ci/assert_action_pins.py\`"
            echo "- Repo: \`sha_pinning_required=true\`"
            echo ""
            echo "ATOM: \`ATOM-CI-POLICY-PINS-20260804\`"
          } >> "$GITHUB_STEP_SUMMARY"
