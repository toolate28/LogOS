# ENTANGLE Observe — manual narrow-wormhole closure envelope
# ATOM: ATOM-ENTANGLE-OBSERVE-20260917
# Evidence only. External media, discussions, and model output never carry authority.

name: ENTANGLE Observe

on:
  workflow_dispatch:
    inputs:
      envelope_path:
        description: Repository-relative observation envelope JSON path
        required: true
        default: ops/entangle/examples/observation-envelope.example.json
      discussion_number:
        description: GitHub Discussion number bound to the narrow wormhole
        required: false

permissions:
  contents: read

jobs:
  observe:
    name: Capture · reconcile · close
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Assert Action SHA pins
        run: python3 ops/ci/assert_action_pins.py
      - name: Run ENTANGLE observation tests
        run: python3 -m unittest ops/ci/test_entangle_observe.py
      - name: Validate ENTANGLE manifest
        run: python3 ops/entangle/validate_manifest.py
      - name: Guard workflow shape
        run: |
          set -euo pipefail
          python3 ops/ci/entangle_observe.py workflow-guard \
            --workflow-path .github/workflows/entangle-observe.yml
      - name: Capture evidence envelope
        env:
          EPHEMERAL_ROOT: ${{ runner.temp }}/narrow-wormhole
          DISCUSSION_ARG: ${{ inputs.discussion_number }}
        run: |
          set -euo pipefail
          mkdir -p "$EPHEMERAL_ROOT"
          args=()
          if [[ -n "${DISCUSSION_ARG:-}" ]]; then
            args+=(--discussion-number "$DISCUSSION_ARG")
          fi
          python3 ops/ci/entangle_observe.py capture \
            --manifest-path ops/entangle/manifest.yaml \
            --envelope-path "${{ inputs.envelope_path }}" \
            --ephemeral-root "$EPHEMERAL_ROOT" \
            "${args[@]}" \
            --out "$EPHEMERAL_ROOT/normalized.json"
        shell: bash
      - name: Reconcile envelope
        env:
          EPHEMERAL_ROOT: ${{ runner.temp }}/narrow-wormhole
        run: |
          set -euo pipefail
          python3 ops/ci/entangle_observe.py reconcile \
            --manifest-path ops/entangle/manifest.yaml \
            --envelope-path "$EPHEMERAL_ROOT/normalized.json" \
            --out "$EPHEMERAL_ROOT/reconcile.json"
      - name: Close envelope
        env:
          EPHEMERAL_ROOT: ${{ runner.temp }}/narrow-wormhole
        run: |
          set -euo pipefail
          python3 ops/ci/entangle_observe.py close \
            --envelope-path "$EPHEMERAL_ROOT/normalized.json" \
            --reconcile-path "$EPHEMERAL_ROOT/reconcile.json" \
            --out "$EPHEMERAL_ROOT/closure.json"
          python3 -m json.tool "$EPHEMERAL_ROOT/closure.json" > /dev/null
