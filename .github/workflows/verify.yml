# Verification pipeline — core invariants + MCP schemas + formal residual report
# ATOM: ATOM-VERIFY-PIPELINE-20260730-sm100
# Recovery: ATOM-VERIFY-UNBLOCK-20260819 · R1–R8 in OPERATOR-JOURNEY-AND-RECOVERY
# Formal sorry residuals are Category B (not CVEs). capability != authority.
# Ghost gitlink crates/coherence-mcp: always checkout with submodules: false.

name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Tree guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Assert Action SHA pins
        run: python3 ops/ci/assert_action_pins.py
      - name: Tree guards
        run: bash ops/ci/guard.sh

  mcp-schemas:
    name: MCP tool schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate mcps/coherence-mcp/tools/*.json
        run: python ops/ci/validate_mcp_schemas.py

  formal-residual:
    name: Formal residual report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Count sorry / axiom (Category B)
        run: python ops/ci/formal_residual_report.py

  json-kit:
    name: Queue + command-surface JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Parse machine twins
        run: |
          set -euo pipefail
          python3 -m json.tool ops/command-surface.json > /dev/null
          if [[ ! -f ops/human-actions.json ]]; then
            echo "::error::missing ops/human-actions.json"
            echo "R8/HITL remediate: ship the SAIF machine twin (ops/human-actions.json)"
            echo "docs: ops/SAIF-OUTSTANDING-HUMAN-ACTIONS.md"
            exit 1
          fi
          python3 -m json.tool ops/human-actions.json > /dev/null
          test -f ops/SAIF-OUTSTANDING-HUMAN-ACTIONS.md
          echo "json-kit: OK"

  ephemeral-context:
    name: Ephemeral zero-trust context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Run ephemeral context tests
        run: python -m unittest ops/ci/test_ephemeral_context.py
      - name: Capture ephemeral context envelope
        run: |
          set -euo pipefail
          mkdir -p artifacts/ephemeral-context
          python ops/ci/ephemeral_context.py capture \
            --repository "${GITHUB_REPOSITORY}" \
            --event-name "${GITHUB_EVENT_NAME}" \
            --workflow-run-id "${GITHUB_RUN_ID}" \
            --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --workflow-job "ephemeral-context" \
            --event-path "${GITHUB_EVENT_PATH}" \
            --ref "${GITHUB_REF}" \
            --commit-sha "${GITHUB_SHA}" \
            --output artifacts/ephemeral-context/context-envelope.json
      - name: Validate ephemeral context envelope
        run: |
          set -euo pipefail
          python ops/ci/ephemeral_context.py validate \
            --input artifacts/ephemeral-context/context-envelope.json \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --seen-hashes-file artifacts/ephemeral-context/seen-hashes.json \
            --record-seen
      - name: Upload ephemeral context artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ephemeral-context-${{ github.run_id }}
          path: artifacts/ephemeral-context/context-envelope.json
          if-no-files-found: error
          retention-days: 1
      - name: Job summary footer
        if: always()
        run: |
          {
            echo ""
            echo "### Ephemeral zero-trust context"
            echo ""
            echo "- Packs repository-bound evidence only"
            echo "- authority_effect remains \`none\`"
            echo "- Transports observations and hashes; does not merge, deploy, publish, or promote state"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-core:
    name: Rust core + wave + invariant
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Check foundation crates
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo check -p reson8-core -p reson8-wave -p resonance-invariant -p reson8-forge-core
          cargo test  -p reson8-core -p reson8-wave -p resonance-invariant -- --nocapture

  rust-activate:
    name: Activated crate compile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Check activated lattice crates
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          failed=0
          for p in reson8-activator reson8-hash reson8-styx spiral-safe reson8-topology reson8-sphinx cutile; do
            echo "::group::cargo check -p ${p}"
            extra=()
            if [[ "$p" == cutile ]]; then
              extra=(--no-default-features)
              echo "R6: cutile CPU path (wgpu 30 API drift is not a Verify gate)"
            fi
            if ! cargo check -p "$p" "${extra[@]}"; then
              echo "::error::crate ${p} failed cargo check"
              if [[ "$p" == cutile ]]; then
                echo "remediate: cargo check -p cutile --no-default-features"
                echo "docs: OPERATOR-JOURNEY §R6 · wgpu-backend is opt-in"
              fi
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"

  lean-green:
    name: Lean 4 green subset
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Install elan
        run: |
          set -euo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: lake build TriWeavon (Category B if root file HELD)
        working-directory: lean
        run: |
          set -euo pipefail
          if [[ ! -f TriWeavon/TriWeavon.lean ]]; then
            echo "::notice title=R7 HELD::lean/TriWeavon/TriWeavon.lean not supplied"
            echo "Absence is not FAIL. Category B. Do not promote residual-zero."
            echo "remediate: restore TriWeavon.lean or lake build TriWeavon.ConservationInvariant"
            echo "docs: OPERATOR-JOURNEY §R7"
            {
              echo "## Lean 4 · HELD not FAIL"
              echo "Root file \`TriWeavon/TriWeavon.lean\` missing. Formal residual stays advisory."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          lake build TriWeavon

  rust-tui-smoke:
    name: TUI + barcode compile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Check TUI surfaces + lib tests
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          if ! cargo test -p reson8-tui --lib -- --nocapture; then
            echo "::error::reson8-tui lib tests failed"
            echo "R5 remediate: cargo test -p reson8-tui --lib"
            echo "run-1 receipt: CapProbe/probe_ops_caps must live in reson8-activator"
            exit 1
          fi
          if ! cargo check -p reson8-tui -p barcode-tui; then
            echo "::error::TUI/barcode check failed"
            echo "R6 remediate: map ratatui Backend::Error into io::Error (barcode-tui main.rs)"
            exit 1
          fi
