# Verification pipeline — core invariants + MCP schemas + formal residual report
# ATOM: ATOM-VERIFY-PIPELINE-20260730-sm100
# Formal sorry residuals are Category B (not CVEs). capability != authority.

name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  guard:
    name: Tree guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Assert Action SHA pins
        run: python3 ops/ci/assert_action_pins.py
      - name: Tree guards
        run: bash ops/ci/guard.sh

  mcp-schemas:
    name: MCP tool schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate mcps/coherence-mcp/tools/*.json
        run: python ops/ci/validate_mcp_schemas.py

  formal-residual:
    name: Formal residual report (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Count sorry / axiom (Category B)
        run: python ops/ci/formal_residual_report.py

  rust-core:
    name: Rust core + wave + invariant
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Check foundation crates
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo check -p reson8-core -p reson8-wave -p resonance-invariant -p reson8-forge-core
          cargo test  -p reson8-core -p reson8-wave -p resonance-invariant -- --nocapture

  rust-tui-smoke:
    name: TUI + barcode compile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rust-core]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Check TUI surfaces
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo check -p reson8-tui -p barcode-tui
