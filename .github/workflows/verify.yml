# Verification pipeline — core invariants + MCP schemas + formal residual report
# ATOM: ATOM-VERIFY-PIPELINE-20260730-sm100
# This is the waist for executable verification. Formal sorry residuals are
# reported as Category B (not CVEs). Capability ≠ authority.

name: Verify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Tree guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: bash ops/ci/guard.sh

  mcp-schemas:
    name: MCP tool schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Validate mcps/coherence-mcp/tools/*.json
        run: python ops/ci/validate_mcp_schemas.py

  formal-residual:
    name: Formal residual report (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Count sorry / axiom (Category B)
        run: python ops/ci/formal_residual_report.py
        # Always green: residuals are not security defects
        continue-on-error: false

  rust-core:
    name: Rust core + wave + invariant
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Check foundation crates
        env:
          CARGO_TERM_COLOR: always
          # Avoid sccache path issues on clean runners
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo check -p reson8-core -p reson8-wave -p resonance-invariant -p reson8-forge-core
          cargo test  -p reson8-core -p reson8-wave -p resonance-invariant -- --nocapture

  rust-tui-smoke:
    name: TUI + barcode compile smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [rust-core]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Check TUI surfaces
        env:
          CARGO_TERM_COLOR: always
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          cargo check -p reson8-tui -p barcode-tui
