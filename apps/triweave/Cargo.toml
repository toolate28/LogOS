[package]
name = "reson8-triweave"
version = "0.1.0"
edition = "2021"
description = "Tri-Weavon orchestrator — unified CLI for Amazon/NEAR/POP/TUI subsystems"

[[bin]]
name = "triweave"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "1.1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
reson8-forge-core = { path = "../../crates/forge-core" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }