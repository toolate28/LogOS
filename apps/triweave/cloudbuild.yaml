# ═══════════════════════════════════════════════════════════════════
# Cloud Build + Cloud Run deployment for Triweave
# Conservation: alpha + omega = 15
#
# Deploy: gcloud builds submit --config apps/triweave/cloudbuild.yaml .
# ═══════════════════════════════════════════════════════════════════

substitutions:
  _SERVICE_NAME: triweave
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/reson8/${_SERVICE_NAME}

steps:
  # ── Build container image ─────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE}:${SHORT_SHA}'
      - '-t'
      - '${_IMAGE}:latest'
      - '-f'
      - 'apps/triweave/Dockerfile'
      - '.'

  # ── Push to Artifact Registry ─────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '--all-tags', '${_IMAGE}']

  # ── Deploy to Cloud Run ───────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_IMAGE}:${SHORT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8088'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--timeout'
      - '300s'
      - '--set-env-vars'
      - 'FORGE_WS_URL=ws://0.0.0.0:8088,RUST_LOG=info'
      - '--set-secrets'
      - 'ANTHROPIC_API_KEY=anthropic-api-key:latest,XAI_API_KEY=xai-api-key:latest,GOOGLE_AI_KEY=google-ai-key:latest'
      - '--allow-unauthenticated'

images:
  - '${_IMAGE}:${SHORT_SHA}'
  - '${_IMAGE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1200s'
