[package]
name = "reson8-nexus-pulse-bot"
version = "0.1.0"
edition = "2021"
description = "Nexus Pulse bot — cross-platform notification and strand health monitoring"

[[bin]]
name = "nexus-pulse-bot"
path = "src/main.rs"

[dependencies]
reson8-core = { path = "../../crates/core" }
reson8-wave = { path = "../../crates/wave" }
reson8-vortex-bridge = { path = "../../crates/vortex-bridge" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
