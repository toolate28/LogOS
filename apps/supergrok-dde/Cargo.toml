[package]
name = "supergrok-dde"
version = "0.4.1"
edition = "2021"
authors = ["TriWeavon Sovereign Team"]
description = "Self-sustaining SuperGrok Data Deployed Engineer Web Instance"
license = "MIT OR Apache-2.0"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Internal crates (adjust paths as needed)
discrete_bkm_predictor = { path = "../artifacts" } # or published crate
triweavon_cudarc = { path = "../triweavon-cudarc", optional = true }

[features]
default = []
cuda = ["triweavon_cudarc/cuda"]
