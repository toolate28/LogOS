[package]
name = "spiral-safe"
version = "0.1.0"
edition = "2021"
description = "SpiralSafe v2: MeaningSeed persistence (CBOR+zstd), Ed25519 signing, and key rotation"
license = "MIT OR Apache-2.0"

[dependencies]
blake3 = "1.5"
ciborium = "0.2"
ed25519-dalek = { version = "3.0", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"