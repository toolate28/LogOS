[workspace]
# LogOS crates workspace — path members that currently ship Cargo.toml.
# Orphans without manifests stay outside (JFA SlowStep — inventory, do not delete).
members = [
    "core",
    "wave",
    "hash",
    "resonance-invariant",
    "atom-sig",
    "fib-braid-core",
    "sphinx",
    "spiral-safe",
    "styx",
    "styx-vfs-layer",
    "vortex-bridge",
    "tui",
    "barcode-tui",
    "cqk-ga",
    "cqk-microlocal",
    "cqk-entropy",
    "cqk-anyon",
    "cqk-wdbi",
    "cqk-kitty-rips-verify",
    "reson8-topology",
    "reson8-wasm",
    "triweavon-cudarc",
    "zero_latency_ledgers",
    "activator",
    "api_triggers",
    "artifact_pipeline",
    "marketplace",
    "forge-core",
    "migration_helpers",
    "bohmian",
    "sysctl",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/toolate28/LogOS"
description = "LogOS / Tri-Weavon Rust lattice — conservation α+ω=15"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
petgraph = { version = "0.6", default-features = false, features = ["serde-1"] }
proptest = "1.4"
