[package]
name = "reson8-vortex-bridge"
version = "0.1.0"
edition = "2021"
description = "Cross-strand bridge — translate between Claude/Grok/Gemini contexts"

# `main.rs` and `src/{server,router,xai_client,models}.rs` are a WIP bridge to
# the Grok strand (xAI client + WAVE gate + ATOM tracker). They reference
# shared types — BridgeError, BridgeCommand, BridgeEvent, BridgeResponse,
# WaveEngine, AtomTracker, ConservationError — that are still being designed
# with the Grok strand and do not yet exist in `reson8-core` or `reson8-wave`.
#
# To keep `cargo check --workspace` green while the scaffold evolves, the
# binary is gated behind the `bin` feature. Build the full bridge with:
#
#     cargo build -p reson8-vortex-bridge --features bin
#
# and collapse this feature once the shared types land.
[lib]
name = "vortex_bridge"
path = "src/lib.rs"

[[bin]]
name = "reson8-vortex-bridge"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = []
bin = [
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:reqwest",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
reson8-core = { path = "../core" }
reson8-wave = { path = "../wave" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio-tungstenite = { version = "0.30", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
