[package]
name = "styx-vfs-layer"
version = "0.1.0"
edition = "2021"
description = "9P2000.L Styx Bookshelf daemon — TCP localhost:5640 (GB-03)"

[[bin]]
name = "styx-bookshelf"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "1"
