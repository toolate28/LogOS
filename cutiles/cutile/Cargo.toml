[package]
name = "cutile"
version = "0.3.0"
build = "build.rs"
edition = "2021"
authors = ["TriWeavon Team"]
description = "Cubical Tiling & HIT Execution Bridge for TriWeavon Manifold + SRAC"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/toolate28/triweavon"

[dependencies]
cudarc = { version = "0.19", features = ["cuda-12040"], optional = true }
wgpu = { version = "30.0", optional = true }
pollster = { version = "1.0", optional = true }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
bytemuck = { version = "1.16", features = ["derive"], optional = true }
eframe = { version = "0.36", optional = true, default-features = false, features = ["wgpu", "default_fonts"] }
egui = { version = "0.36", optional = true }

[features]
# Default is CPU-only (R6). wgpu 30 API drift must not gate Verify.
# Enable `wgpu-backend` or `cuda` when GPU backends are needed.
default = []
cuda = ["dep:cudarc"]
wgpu-backend = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
viz = ["dep:eframe", "dep:egui"]
viz-async = ["viz"]
# Signature-freeze surface from ATOM-SCHEMA-FREEZE-V0_1 (todo!() bodies only).
schema_freeze_v0_1 = []

[[bin]]
name = "demo_existence_certificate_emission"
path = "src/bin/demo_existence_certificate_emission.rs"

[[example]]
name = "basic_hit"
path = "examples/basic_hit.rs"

[[example]]
name = "entropy_benchmark"
path = "examples/entropy_benchmark.rs"

[[example]]
name = "tqec_braid_viz"
path = "examples/tqec_braid_viz.rs"
required-features = ["viz"]

[[example]]
name = "tqec_concurrent_cascade"
path = "examples/tqec_concurrent_cascade.rs"
required-features = ["viz-async"]